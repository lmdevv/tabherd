name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm exec oxlint
      - run: pnpm exec oxfmt --check
        if: runner.os == 'Linux'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Branded Chrome ignores --load-extension; use a Chromium build.
      - uses: browser-actions/setup-chrome@v1
        id: chromium
        with:
          chrome-version: latest
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
        env:
          TABHERD_CHROMIUM: ${{ steps.chromium.outputs.chrome-path }}

  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:firefox
        env:
          TABHERD_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}

  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: nix run . -- --version
      # The browsers below talk to the Nix build, registered the way the modules register it.
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        if: runner.os == 'Linux'
        id: chromium
        with:
          chrome-version: latest
          install-dependencies: true
      - if: runner.os == 'Linux'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter extension build
          pnpm --filter extension build:firefox
          tabherd=$(nix build --no-link --print-out-paths .#tabherd)
          echo "TABHERD_CLI=$tabherd/bin/tabherd" >> "$GITHUB_ENV"
          echo "TABHERD_PACKAGE=$tabherd" >> "$GITHUB_ENV"
          # nixpkgs' Firefox wrapper with the host, as programs.firefox.nativeMessagingHosts builds it.
          firefox=$(nix build --no-link --print-out-paths --impure --expr \
            'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.x86_64-linux.firefox.override { nativeMessagingHosts = [ f.packages.x86_64-linux.default ]; }')
          echo "TABHERD_FIREFOX=$firefox/bin/firefox" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: node packages/bridge/test/browser-smoke.mjs
        env:
          TABHERD_CHROMIUM: ${{ steps.chromium.outputs.chrome-path }}
          TABHERD_NATIVE_MANIFEST: ${{ env.TABHERD_PACKAGE }}/etc/chromium/native-messaging-hosts/com.tabherd.bridge.json
      - if: runner.os == 'Linux'
        run: node packages/bridge/test/firefox-smoke.mjs
        env:
          TABHERD_NATIVE_MANIFEST: browser
